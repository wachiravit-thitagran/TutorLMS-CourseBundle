name: Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: PHP syntax / ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null; then
              php -l "$file"
              status=1
            fi
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
          exit $status

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report-full --report-checkstyle=./phpcs-report.xml
        continue-on-error: true

      - name: Annotate the diff
        run: cs2pr ./phpcs-report.xml
        if: always()

  static-checks:
    name: Repository sanity checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Check the PSR-4 mapping
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            [ "$file" = "./src/functions.php" ] && continue

            ns=$(grep -m1 -oP '^namespace\s+\K[^;]+' "$file" || true)
            cls=$(grep -m1 -oP '^(final\s+)?(abstract\s+)?(class|interface|trait)\s+\K\w+' "$file" || true)

            if [ -z "$ns" ] || [ -z "$cls" ]; then
              echo "::error file=$file::Missing namespace or class declaration"
              status=1
              continue
            fi

            rel=${ns#SpaceWork\\TutorCourseBundles}
            rel=${rel//\\//}
            expected="./src${rel}/${cls}.php"

            if [ "$expected" != "$file" ]; then
              echo "::error file=$file::Autoloader mismatch, expected $expected"
              status=1
            fi
          done < <(find ./src -type f -name '*.php')
          exit $status

      - name: Check every file guards against direct access
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            if ! grep -q "defined( 'ABSPATH' )\|defined( 'WP_UNINSTALL_PLUGIN' )" "$file"; then
              echo "::error file=$file::Missing ABSPATH guard"
              status=1
            fi
          done < <(find ./src ./templates -type f -name '*.php')
          exit $status

      - name: Check for Tutor LMS Pro references
        shell: bash
        run: |
          if grep -rnE "TUTOR_PRO|tutor_pro\(|is_plugin_active\(\s*['\"]tutor-pro" \
              --include='*.php' src templates tutor-course-bundles.php; then
            echo "::error::The plugin must not reference Tutor LMS Pro."
            exit 1
          fi
          echo "No Pro references found."

      - name: Validate JSON fixtures
        shell: bash
        run: |
          status=0
          for file in tests/fixtures/*.json; do
            if ! php -r 'exit(json_decode(file_get_contents($argv[1])) === null ? 1 : 0);' "$file"; then
              echo "::error file=$file::Invalid JSON"
              status=1
            fi
          done
          exit $status
