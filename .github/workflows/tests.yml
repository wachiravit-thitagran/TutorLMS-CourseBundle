name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      tutor_version:
        description: 'Tutor LMS version to test against (e.g. 3.0.0 or "latest")'
        required: false
        default: 'latest'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  WP_CORE_DIR: /tmp/wordpress
  WP_TESTS_DIR: /tmp/wordpress-tests-lib
  WP_PLUGIN_DIR: /tmp/wordpress/wp-content/plugins

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: no WordPress, no database.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Run the unit suite
        run: composer run test:unit

  # ---------------------------------------------------------------------------
  # The real thing: WordPress, MySQL, Tutor LMS and WooCommerce.
  # ---------------------------------------------------------------------------
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Integration / PHP 8.1 / WP latest'
            php: '8.1'
            wordpress: 'latest'
            tutor: 'latest'
            woocommerce: 'latest'

          - name: 'Integration / PHP 8.2 / WP latest'
            php: '8.2'
            wordpress: 'latest'
            tutor: 'latest'
            woocommerce: 'latest'

          - name: 'Integration / PHP 8.3 / WP latest'
            php: '8.3'
            wordpress: 'latest'
            tutor: 'latest'
            woocommerce: 'latest'

          - name: 'Integration / PHP 8.4 / WP latest'
            php: '8.4'
            wordpress: 'latest'
            tutor: 'latest'
            woocommerce: 'latest'

          # Oldest supported WordPress, per the plugin header.
          - name: 'Integration / PHP 8.1 / WP 6.5 (minimum)'
            php: '8.1'
            wordpress: '6.5'
            tutor: 'latest'
            woocommerce: 'latest'

          # Sites that only sell free bundles never install WooCommerce.
          - name: 'Integration / no WooCommerce'
            php: '8.3'
            wordpress: 'latest'
            tutor: 'latest'
            woocommerce: 'skip'

          # Canary: catches breaking changes before they ship.
          - name: 'Integration / WP nightly (experimental)'
            php: '8.3'
            wordpress: 'nightly'
            tutor: 'latest'
            woocommerce: 'latest'
            experimental: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip, gd, json, intl
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends subversion mysql-client

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready." >&2
          exit 1

      - name: Install WordPress ${{ matrix.wordpress }}
        run: |
          chmod +x bin/install-wp-tests.sh
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }} true

      - name: Install Tutor LMS and WooCommerce
        env:
          SKIP_WOOCOMMERCE: ${{ matrix.woocommerce == 'skip' }}
          TUTOR_INPUT: ${{ github.event.inputs.tutor_version }}
        run: |
          chmod +x bin/install-test-plugins.sh
          TUTOR_VERSION="${TUTOR_INPUT:-${{ matrix.tutor }}}"
          WC_VERSION="${{ matrix.woocommerce }}"
          if [ "$WC_VERSION" = "skip" ]; then WC_VERSION="latest"; fi
          bash bin/install-test-plugins.sh "$TUTOR_VERSION" "$WC_VERSION"

      - name: Report the environment
        run: |
          php -v
          echo "WordPress:  ${{ matrix.wordpress }}"
          echo "Tutor LMS:  ${{ matrix.tutor }}"
          echo "WooCommerce: ${{ matrix.woocommerce }}"
          ls -1 "$WP_PLUGIN_DIR"

      - name: Run the integration suite
        run: composer run test:integration

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.php }}-${{ matrix.wordpress }}-${{ matrix.woocommerce }}
          path: |
            /tmp/wordpress/wp-content/debug.log
            build/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Coverage, reported once rather than per matrix leg.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip, gd, json, intl
          coverage: pcov
          tools: composer:v2

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends subversion mysql-client

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install WordPress and plugins
        run: |
          chmod +x bin/install-wp-tests.sh bin/install-test-plugins.sh
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest true
          bash bin/install-test-plugins.sh latest latest

      - name: Unit coverage
        run: vendor/bin/phpunit --configuration phpunit-unit.xml.dist --coverage-clover build/logs/clover-unit.xml

      - name: Integration coverage
        run: vendor/bin/phpunit --configuration phpunit-integration.xml.dist --coverage-clover build/logs/clover-integration.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/logs/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # One green check for branch protection to point at.
  # ---------------------------------------------------------------------------
  result:
    name: Test result
    runs-on: ubuntu-latest
    needs: [unit, integration]
    if: always()

    steps:
      - name: Fail if anything required failed
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ]; then
            echo "unit: ${{ needs.unit.result }}"
            echo "integration: ${{ needs.integration.result }}"
            exit 1
          fi
          echo "All required jobs passed."
